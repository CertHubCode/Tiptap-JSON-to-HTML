<ul style="list-style-type:none;padding-left:0" class="checklist">{%- for item in node.attrs.content -%}<li
        style="list-style-type:none"><label class="checklist-item"
            style="display:flex;user-select:none;align-items:flex-start;gap:8px;padding:0"><span
                class="checkbox {% if item.checked %}checkbox--checked{% endif %}"></span><span
                class="checklist-label" style="color:#4b5563;font-size:12px">{{ item.label }}</span></label>
    </li>{%- endfor -%}</ul>
