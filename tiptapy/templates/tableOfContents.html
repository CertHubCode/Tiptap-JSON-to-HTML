{#- Regenerated from the document's headings (toc_entries is precomputed by
    BaseDoc.render); the node itself carries no content. -#}
<div class="table-of-contents" style="border: 1px solid #ddd; border-radius: 6px; padding: 8px 12px; margin: 8px 0;">
  <div style="font-weight: 600; margin-bottom: 4px;">Table of contents</div>
  {%- if toc_entries -%}
  <ol style="list-style: none; margin: 0; padding: 0;">
  {%- for entry in toc_entries -%}
    <li style="padding-left: {{ (entry.level - 1) * 16 }}px;">{{ entry.index }} {{ entry.text }}</li>
  {%- endfor -%}
  </ol>
  {%- endif -%}
</div>
