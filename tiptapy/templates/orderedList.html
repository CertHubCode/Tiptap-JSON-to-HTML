{%- if node.attrs.start -%}
<ol start="{{ node.attrs.start }}"{% if node.attrs.type %} type="{{ node.attrs.type }}"{% endif %}{{ extract_tag_attrs(node) }}{{ extract_node_style(node) }}>
{%- else -%}
<ol start="{{ node.attrs.order|default(1) }}"{% if node.attrs.type %} type="{{ node.attrs.type }}"{% endif %}{{ extract_tag_attrs(node) }}{{ extract_node_style(node) }}>
{%- endif -%}
{%- for item in node.content -%}
  {%- with template=item.type + '.html', node=item -%}
      {%- include template -%}
        {%- endwith -%}
	{%- endfor -%}
</ol>
