# .github/workflows/claude-code-review.yml
name: Claude – PR Review

# Started by hand: Actions → Claude – PR Review → Run workflow, then enter the
# pull request number. PR comments do not start it.
on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

jobs:
  claude-review:
    # Ceiling for the called workflow; each job inside narrows it further.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: CertHubCode/.github/.github/workflows/claude-code-review.yml@main
    with:
      pr_number: ${{ inputs.pr_number }}
    secrets: inherit
