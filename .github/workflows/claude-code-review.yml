# .github/workflows/claude-code-review.yml
name: Claude – PR Review

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude-review:
    # Ceiling for the called workflow; each job inside narrows it further.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: CertHubCode/.github/.github/workflows/claude-code-review.yml@main
    secrets: inherit
